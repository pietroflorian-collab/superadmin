<!DOCTYPE html>
<html lang="es" class="h-full bg-zinc-50 dark:bg-zinc-950 antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionar Cliente — Panel Maestro</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://unpkg.com/lucide@latest" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2318181b'/><text x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='700' fill='white' text-anchor='middle'>P</text></svg>">

  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e4e4e7; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #d4d4d8; }
    .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #52525b; }
  </style>
</head>
<body class="h-full bg-zinc-50 dark:bg-zinc-950 font-sans text-zinc-900 dark:text-zinc-100 antialiased flex flex-col overflow-hidden">

  <!-- Overlay de arranque -->
  <div id="boot-overlay" class="fixed inset-0 z-50 bg-zinc-50 dark:bg-zinc-950 flex items-center justify-center">
    <div class="w-6 h-6 border-2 border-zinc-300 dark:border-zinc-700 border-t-zinc-900 dark:border-t-zinc-100 rounded-full animate-spin"></div>
  </div>

  <!-- ============================================ -->
  <!-- HEADER                                        -->
  <!-- ============================================ -->
  <header class="h-16 border-b border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-6 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-4 min-w-0">
      <button id="btn-volver" class="h-8 px-3 rounded-md border border-zinc-200 dark:border-zinc-700 text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-xs font-medium flex items-center gap-1.5 transition-colors">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5" aria-hidden="true"></i>
        <span>Volver</span>
      </button>

      <div class="w-px h-6 bg-zinc-200 dark:bg-zinc-700"></div>

      <div class="flex items-center gap-3 min-w-0">
        <div id="cliente-avatar" class="w-9 h-9 rounded-md bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 flex items-center justify-center font-bold text-sm shrink-0">--</div>
        <div class="min-w-0">
          <h1 id="cliente-nombre" class="text-sm font-semibold text-zinc-900 dark:text-zinc-100 truncate">Cargando…</h1>
          <p id="cliente-sub" class="text-[11px] text-zinc-400 dark:text-zinc-500 font-mono truncate">Panel de Gestión</p>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <span id="cliente-estado" class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 border border-zinc-200 dark:border-zinc-700">
        <span class="w-2 h-2 rounded-full bg-zinc-400"></span>--
      </span>
    </div>
  </header>

  <!-- ============================================ -->
  <!-- TABS                                          -->
  <!-- ============================================ -->
  <nav class="border-b border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-6 shrink-0">
    <div class="flex gap-1 overflow-x-auto">
      <button data-tab="apariencia" class="tab-btn px-4 py-3 text-xs font-medium border-b-2 border-transparent text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors whitespace-nowrap">
        <i data-lucide="sliders" class="w-3.5 h-3.5 inline-block mr-1.5 align-text-bottom" aria-hidden="true"></i>Apariencia
      </button>
      <button data-tab="boveda" class="tab-btn px-4 py-3 text-xs font-medium border-b-2 border-transparent text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors whitespace-nowrap">
        <i data-lucide="vault" class="w-3.5 h-3.5 inline-block mr-1.5 align-text-bottom" aria-hidden="true"></i>Bóveda
      </button>
      <button data-tab="datos" class="tab-btn px-4 py-3 text-xs font-medium border-b-2 border-transparent text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors whitespace-nowrap">
        <i data-lucide="id-card" class="w-3.5 h-3.5 inline-block mr-1.5 align-text-bottom" aria-hidden="true"></i>Datos
      </button>
      <button data-tab="redes" class="tab-btn px-4 py-3 text-xs font-medium border-b-2 border-transparent text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors whitespace-nowrap">
        <i data-lucide="share-2" class="w-3.5 h-3.5 inline-block mr-1.5 align-text-bottom" aria-hidden="true"></i>Redes
      </button>
      <button data-tab="direcciones" class="tab-btn px-4 py-3 text-xs font-medium border-b-2 border-transparent text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors whitespace-nowrap">
        <i data-lucide="map-pin" class="w-3.5 h-3.5 inline-block mr-1.5 align-text-bottom" aria-hidden="true"></i>Direcciones
      </button>
      <button data-tab="fechas" class="tab-btn px-4 py-3 text-xs font-medium border-b-2 border-transparent text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors whitespace-nowrap">
        <i data-lucide="calendar" class="w-3.5 h-3.5 inline-block mr-1.5 align-text-bottom" aria-hidden="true"></i>Fechas
      </button>
    </div>
  </nav>

  <!-- ============================================ -->
  <!-- CONTENIDO                                     -->
  <!-- ============================================ -->
  <main class="flex-1 overflow-y-auto p-6 bg-zinc-50 dark:bg-zinc-950">
    <div class="max-w-5xl mx-auto space-y-6">

      <section data-tab-content="apariencia" class="tab-content">
        <div class="border border-zinc-200 dark:border-zinc-800 rounded-lg p-8 bg-white dark:bg-zinc-900 text-center">
          <i data-lucide="sliders" class="w-8 h-8 mx-auto text-zinc-400 dark:text-zinc-600 mb-3" aria-hidden="true"></i>
          <p class="text-xs text-zinc-500 dark:text-zinc-400">Motor de Apariencia — en construcción</p>
        </div>
      </section>

      <section data-tab-content="boveda" class="tab-content hidden">
        <div class="border border-zinc-200 dark:border-zinc-800 rounded-lg p-8 bg-white dark:bg-zinc-900 text-center">
          <i data-lucide="vault" class="w-8 h-8 mx-auto text-zinc-400 dark:text-zinc-600 mb-3" aria-hidden="true"></i>
          <p class="text-xs text-zinc-500 dark:text-zinc-400">Bóveda de Credenciales — en construcción</p>
        </div>
      </section>

      <section data-tab-content="datos" class="tab-content hidden">
        <div class="border border-zinc-200 dark:border-zinc-800 rounded-lg p-8 bg-white dark:bg-zinc-900 text-center">
          <i data-lucide="id-card" class="w-8 h-8 mx-auto text-zinc-400 dark:text-zinc-600 mb-3" aria-hidden="true"></i>
          <p class="text-xs text-zinc-500 dark:text-zinc-400">Datos del Cliente — en construcción</p>
        </div>
      </section>

      <section data-tab-content="redes" class="tab-content hidden">
        <div class="border border-zinc-200 dark:border-zinc-800 rounded-lg p-8 bg-white dark:bg-zinc-900 text-center">
          <i data-lucide="share-2" class="w-8 h-8 mx-auto text-zinc-400 dark:text-zinc-600 mb-3" aria-hidden="true"></i>
          <p class="text-xs text-zinc-500 dark:text-zinc-400">Redes Sociales — en construcción</p>
        </div>
      </section>

      <section data-tab-content="direcciones" class="tab-content hidden">
        <div class="border border-zinc-200 dark:border-zinc-800 rounded-lg p-8 bg-white dark:bg-zinc-900 text-center">
          <i data-lucide="map-pin" class="w-8 h-8 mx-auto text-zinc-400 dark:text-zinc-600 mb-3" aria-hidden="true"></i>
          <p class="text-xs text-zinc-500 dark:text-zinc-400">Direcciones — en construcción</p>
        </div>
      </section>

      <section data-tab-content="fechas" class="tab-content hidden">
        <div class="border border-zinc-200 dark:border-zinc-800 rounded-lg p-8 bg-white dark:bg-zinc-900 text-center">
          <i data-lucide="calendar" class="w-8 h-8 mx-auto text-zinc-400 dark:text-zinc-600 mb-3" aria-hidden="true"></i>
          <p class="text-xs text-zinc-500 dark:text-zinc-400">Fechas — en construcción</p>
        </div>
      </section>

    </div>
  </main>

  <script type="module" src="js/gestionar-page.js"></script>
</body>
</html>
