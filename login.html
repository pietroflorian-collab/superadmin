<!DOCTYPE html>
<html lang="es" class="h-full bg-zinc-50 antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso — Panel Maestro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2318181b'/><text x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='700' fill='white' text-anchor='middle'>P</text></svg>">
</head>
<body class="h-full bg-zinc-50 font-sans text-zinc-900 antialiased flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-6">
      <div class="w-11 h-11 rounded-md bg-zinc-900 text-white flex items-center justify-center font-bold shadow-sm mb-3">
        <i data-lucide="cpu" class="w-5 h-5" aria-hidden="true"></i>
      </div>
      <h1 class="text-base font-semibold tracking-tight">Soluciones de Inteligencia Artificial</h1>
      <p class="text-xs text-zinc-500 mt-1">Panel Maestro</p>
    </div>

    <div class="bg-white border border-zinc-200 rounded-lg shadow-sm p-6 space-y-4">
      <div>
        <h2 class="text-sm font-semibold">Acceso restringido</h2>
        <p class="text-[11px] text-zinc-500 mt-1">Introduce tus credenciales para continuar.</p>
      </div>

      <form id="form-login" class="space-y-3" novalidate>
        <div class="space-y-1">
          <label for="login-email" class="text-[11px] font-medium text-zinc-500">Correo</label>
          <input id="login-email" type="email" required autocomplete="email"
                 class="w-full bg-zinc-50 border border-zinc-200 rounded-md px-3 py-2 text-xs focus:outline-none focus:border-zinc-400">
        </div>
        <div class="space-y-1">
          <label for="login-password" class="text-[11px] font-medium text-zinc-500">Contraseña</label>
          <div class="flex gap-2">
            <input id="login-password" type="password" required autocomplete="current-password"
                   class="flex-1 bg-zinc-50 border border-zinc-200 rounded-md px-3 py-2 text-xs focus:outline-none focus:border-zinc-400">
            <button type="button" id="btn-toggle-pass" aria-label="Mostrar"
                    class="px-2.5 rounded-md border border-zinc-200 text-zinc-500 hover:bg-zinc-100">
              <i data-lucide="eye" class="w-3.5 h-3.5" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <p id="login-status" class="text-[11px] font-mono min-h-[1rem]"></p>

        <button id="btn-login" type="submit"
                class="w-full h-9 rounded-md bg-zinc-900 text-white text-xs font-medium hover:bg-zinc-800 transition-colors shadow-sm disabled:opacity-60 disabled:cursor-not-allowed">
          Entrar
        </button>
      </form>

      <div class="relative">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-zinc-200"></div></div>
        <div class="relative flex justify-center"><span class="bg-white px-2 text-[10px] text-zinc-400 font-mono">O</span></div>
      </div>

      <button id="btn-login-google" type="button"
              class="w-full h-9 rounded-md border border-zinc-200 bg-white text-zinc-700 text-xs font-medium hover:bg-zinc-50 transition-colors flex items-center justify-center gap-2">
        <svg class="w-4 h-4" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continuar con Google
      </button>
    </div>

    <p class="text-center text-[10px] text-zinc-400 mt-4 font-mono">Solo administradores autorizados</p>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
